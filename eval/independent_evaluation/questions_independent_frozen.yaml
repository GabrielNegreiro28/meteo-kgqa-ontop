questions:
- id: E01
  category: simples
  question: Qual foi a temperatura média do ar em SBAN em maio de 2016?
  expected_behavior: answerable
  rationale: A grandeza e o recorte solicitados estão disponíveis nos CSV e permitem cálculo direto.
  assumptions: 'Horários em Brasília, UTC−3 fixo; datas incluem os dias indicados. Vazios, textos não numéricos e valores
    fora dos limites declarados são ausentes, nunca zero. Faixas aceitas: bseco: de -80 a 60, inclusive, na unidade original.
    Temperatura em °C. Duplicatas de estação e instante são consolidadas pela média de cada valor válido; cada instante tem
    peso igual.'
  oracle_pandas: |
    import pandas as pd
    from pathlib import Path

    path = Path('C:\\Users\\Gabriel\\OneDrive\\Área de Trabalho\\Parente\\METEOROLOGIA') / 'temperatura.csv'
    columns = ['sigla', 'hora_observacao', 'bseco']
    stations = ['SBAN']
    parts = []
    for chunk in pd.read_csv(path, usecols=columns, dtype=str, sep=None,
                             engine="python", chunksize=50000):
        chunk["sigla"] = chunk["sigla"].str.strip().str.upper()
        chunk = chunk.loc[chunk["sigla"].isin(stations)].copy()
        chunk["hora_observacao"] = pd.to_datetime(chunk["hora_observacao"], errors="coerce")
        chunk = chunk.loc[chunk["hora_observacao"].ge(pd.Timestamp('2016-05-01')) &
                          chunk["hora_observacao"].lt(pd.Timestamp('2016-06-01'))]
        if not chunk.empty:
            parts.append(chunk)
    d = pd.concat(parts, ignore_index=True) if parts else pd.DataFrame(columns=columns)
    d["hora_observacao"] = pd.to_datetime(d["hora_observacao"], errors="coerce")
    d['bseco'] = pd.to_numeric(d['bseco'].astype("string").str.strip().str.replace(",", ".", regex=False), errors="coerce")
    d['bseco'] = d['bseco'].where(d['bseco'].between(-80, 60)).astype(float) * 1
    d = d.groupby(["sigla", "hora_observacao"], as_index=False)[['bseco']].mean()
    def value(x):
        return None if pd.isna(x) else float(x)
    result = [(value(d["bseco"].mean()),)]
