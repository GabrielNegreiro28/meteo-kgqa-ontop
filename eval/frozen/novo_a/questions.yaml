questions:
- id: E01
  category: simples
  question: Qual foi a temperatura média do ponto de orvalho em SBBE em julho de 2018?
  expected_behavior: answerable
  rationale: Média de uma grandeza existente, uma estação, um mês.
  assumptions: Hora local fixa UTC-3 como nos arquivos. Descartei temppo fora de [-20,
    40] °C; vazios ignorados; todos os boletins do mês entram na média.
  oracle_pandas: "import pandas as pd\ndef rd(f, cols, st):\n    d = pd.concat(c[c.sigla.isin(st)]\
    \ for c in pd.read_csv(f, usecols=['sigla', 'hora_observacao'] + cols, chunksize=10**6))\n\
    \    d['t'] = pd.to_datetime(d.hora_observacao)\n    return d\nd = rd('temperatura.csv',\
    \ ['temppo'], ['SBBE'])\nd = d[(d.t.dt.year == 2018) & (d.t.dt.month == 7) & d.temppo.between(-20,\
    \ 40)]\nresult = [(round(d.temppo.mean(), 2),)]\n"
