  question: Em que mês de 2021 mais choveu em SBGR, e quanto?
  expected_behavior: answerable
  rationale: Mês de maior total de chuva em um ano.
  assumptions: Hora local fixa UTC-3 como nos arquivos. Para grandezas acumuladas/contadas
    por hora usa só boletins na hora cheia (minuto 0). Descartei precip fora de [0,
    200] mm.
  oracle_pandas: "import pandas as pd\ndef rd(f, cols, st):\n    d = pd.concat(c[c.sigla.isin(st)]\
    \ for c in pd.read_csv(f, usecols=['sigla', 'hora_observacao'] + cols, chunksize=10**6))\n\
    \    d['t'] = pd.to_datetime(d.hora_observacao)\n    return d\nd = rd('precipitacao.csv',\
    \ ['precip'], ['SBGR'])\nd = d[(d.t.dt.year == 2021) & (d.t.dt.minute == 0) &\
    \ d.precip.between(0, 200)]\ns = d.groupby(d.t.dt.month).precip.sum()\nresult\
    \ = [(int(s.idxmax()), round(s.max(), 1))]\n"
