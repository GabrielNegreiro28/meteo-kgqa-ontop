  category: serie_ranking
  question: Qual estação registrou a maior rajada de vento em 2022?
  expected_behavior: answerable
  rationale: Ranking (primeiro lugar) entre estações.
  assumptions: Hora local fixa UTC-3 como nos arquivos. Rajada em nós; descartei rajada
