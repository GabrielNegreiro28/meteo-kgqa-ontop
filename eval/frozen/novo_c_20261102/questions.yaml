    \ in pd.read_csv('temperatura.csv', usecols=['sigla', 'hora_observacao', 'ur'],\
    \ chunksize=100000):\n    if stations is not None:\n        chunk = chunk.loc[chunk['sigla'].isin(stations)]\n\
    \    chunk = chunk.loc[(chunk['hora_observacao'] >= '2017-07-01') & (chunk['hora_observacao']\
