questions:
- id: E51
  category: simples
  question: Quanto marcou o menor bulbo úmido de SBAE em junho de 2016?
  expected_behavior: answerable
  rationale: A grandeza e o recorte pedidos estão disponíveis nos CSVs originais.
  assumptions: UTC−3 fixo; início inclusivo e fim exclusivo. Vazios, datas inválidas
    e valores de bumido fora de [-40, 50] °C descartados. Duplicatas no mesmo instante
    reduzidas à média dos valores válidos.
  oracle_pandas: "import pandas as pd\nstations = ['SBAE']\nparts = []\nfor chunk\
    \ in pd.read_csv('temperatura.csv', usecols=['sigla', 'hora_observacao', 'bumido'],\
    \ chunksize=100000):\n    if stations is not None:\n        chunk = chunk.loc[chunk['sigla'].isin(stations)]\n\
    \    chunk = chunk.loc[(chunk['hora_observacao'] >= '2016-06-01') & (chunk['hora_observacao']\
    \ < '2016-07-01')].copy()\n    parts.append(chunk)\nd = pd.concat(parts, ignore_index=True)\n\
    d['hora_observacao'] = pd.to_datetime(d['hora_observacao'], errors='coerce')\n\
    d['bumido'] = pd.to_numeric(d['bumido'], errors='coerce')\nd = d.loc[d['hora_observacao'].notna()\
    \ & d['bumido'].between(-40, 50)]\nd = d.groupby(['sigla', 'hora_observacao'],\
    \ as_index=False)['bumido'].mean()\nassert not d.empty, 'Sem observações válidas\
    \ após os filtros'\nresult = [(float(d['bumido'].min()),)]\n"
