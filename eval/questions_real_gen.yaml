- id: RG09
  split: gen
  category: comparacao_entre_estacoes
  question: Qual teve mais chuva em 2020, SBRF ou SBSV?
  expected_status: answered
  compare: {mode: per_group, columns: [station, value, n], key: [station], tolerance: {value: 0.001}}
  note: A pergunta pede qual choveu mais; a resposta aceita mostra os dois totais (a comparação sai dos dois valores).
  sparql: |
    SELECT ?station (SUM(?v) AS ?value) (COUNT(?v) AS ?n) WHERE {
      VALUES ?station { st:SBRF st:SBSV }
      ?station sosa:hosts ?s .
      ?o a met:AccumulatedObservation ; sosa:madeBySensor ?s ; sosa:observedProperty met:Precipitation ;
         met:localDate ?d ; sosa:hasResult/qudt:numericValue ?v .
      FILTER(?d >= "2020-01-01"^^xsd:date && ?d <= "2020-12-31"^^xsd:date)
    } GROUP BY ?station
- id: RG10
  split: gen
  category: quando_foi_o_extremo
  question: Quando foi registrada a menor temperatura em SBCT em 2019?
  expected_status: answered
  compare: {mode: set, columns: [value, t]}
  sparql: |
    SELECT ?value ?t WHERE {
      { SELECT (MIN(?v) AS ?value) WHERE {
          st:SBCT sosa:hosts ?s0 .
          ?o0 a met:InstantaneousObservation ; sosa:madeBySensor ?s0 ; sosa:observedProperty met:AirTemperature ;
              met:localDate ?d0 ; sosa:hasResult/qudt:numericValue ?v .
          FILTER(?d0 >= "2019-01-01"^^xsd:date && ?d0 <= "2019-12-31"^^xsd:date) } }
      st:SBCT sosa:hosts ?s .
      ?o a met:InstantaneousObservation ; sosa:madeBySensor ?s ; sosa:observedProperty met:AirTemperature ;
         met:localDate ?d ; sosa:resultTime ?t ; sosa:hasResult/qudt:numericValue ?value .
      FILTER(?d >= "2019-01-01"^^xsd:date && ?d <= "2019-12-31"^^xsd:date)
    }
