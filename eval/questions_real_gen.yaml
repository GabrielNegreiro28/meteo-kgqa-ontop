# Conjunto de GENERALIZAÇÃO sobre o grafo real (Ontop): escrito DEPOIS da medição v6 × v4 em questions_real_fresh.yaml e ANTES de rodar
# qualquer LLM nele. Diferente do anterior, NÃO foi desenhado para exercitar as capacidades do v6: a maioria são formas simples ou
# cobradas de jeitos que as regras de linguagem não esperam; há sondas deliberadas de buracos conhecidos do v6 (RG17, RG18: superlativo
# no SINGULAR sobre grupos, sem número) e uma comparação entre estações (RG09). Oráculo: eval/oracle_real_gen.py.
# Nunca use para ajustar regra ou prompt.
questions:
- id: RG01
  split: gen
  category: media_mes
  question: Qual foi a temperatura média de SBGL em janeiro de 2022?
  expected_status: answered
  compare: {mode: per_group, columns: [value, n], key: [], tolerance: {value: 0.001}}
  sparql: |
    SELECT (AVG(?v) AS ?value) (COUNT(?v) AS ?n) WHERE {
      st:SBGL sosa:hosts ?s .
      ?o a met:InstantaneousObservation ; sosa:madeBySensor ?s ; sosa:observedProperty met:AirTemperature ;
         met:localDate ?d ; sosa:hasResult/qudt:numericValue ?v .
      FILTER(?d >= "2022-01-01"^^xsd:date && ?d <= "2022-01-31"^^xsd:date)
    }
