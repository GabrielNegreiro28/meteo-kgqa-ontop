- id: RF16
  split: fresh
  category: agrupamento_nao_suportado
  question: Qual foi a precipitação total de SBSP por gênero de nuvem em 2019?
  expected_status: unsupported
  note: Não existe agrupamento por gênero de nuvem. Responder o total ignorando o "por gênero de nuvem" seria responder outra pergunta.
