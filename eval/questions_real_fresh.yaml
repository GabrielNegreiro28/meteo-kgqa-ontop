- id: RF11
  split: fresh
  category: contagem_com_filtro
  question: Quantas medições de visibilidade abaixo de 800 metros SBSP registrou em 2019?
  expected_status: answered
  compare: {mode: per_group, columns: [n], key: []}
  sparql: |
    SELECT (COUNT(?v) AS ?n) WHERE {
      st:SBSP sosa:hosts ?s .
      ?o a met:InstantaneousObservation ; sosa:madeBySensor ?s ; sosa:observedProperty met:PrevailingVisibility ;
