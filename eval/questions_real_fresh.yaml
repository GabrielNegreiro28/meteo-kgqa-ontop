    }
- id: RF12
  split: fresh
  category: nome_de_cidade
  question: Qual foi a temperatura média em Curitiba em 2020?
  expected_status: unsupported
  expected_diagnostic: ENTITY_TEXT_MISMATCH
  note: Os dados só têm o código ICAO (SBCT é Curitiba), nunca o nome da cidade. O sistema não pode adivinhar com conhecimento externo.
