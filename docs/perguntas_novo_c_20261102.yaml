questions:
- id: E151
  category: simples
  question: Qual foi a temperatura do ar mais alta registrada em SBGR em janeiro de 2016?
  expected_behavior: answerable
  rationale: A grandeza e o recorte pedidos existem nos CSVs originais.
  assumptions: UTC−3 fixo; início inclusivo e fim exclusivo. Vazios, datas inválidas e valores de bseco fora de [-40, 60]
    °C descartados. Duplicatas do mesmo instante (estação e hora) reduzidas à média dos valores válidos.
  oracle_pandas: |
    import pandas as pd
    stations = ['SBGR']
    parts = []
    for chunk in pd.read_csv('temperatura.csv', usecols=['sigla', 'hora_observacao', 'bseco'], chunksize=100000):
        if stations is not None:
            chunk = chunk.loc[chunk['sigla'].isin(stations)]
        chunk = chunk.loc[(chunk['hora_observacao'] >= '2016-01-01') & (chunk['hora_observacao'] < '2016-02-01')].copy()
        parts.append(chunk)
    d = pd.concat(parts, ignore_index=True)
    d['hora_observacao'] = pd.to_datetime(d['hora_observacao'], errors='coerce')
    d['bseco'] = pd.to_numeric(d['bseco'], errors='coerce')
    d = d.loc[d['hora_observacao'].notna() & d['bseco'].between(-40, 60)]
    d = d.groupby(['sigla', 'hora_observacao'], as_index=False)['bseco'].mean()
    assert not d.empty, 'Sem observações válidas após os filtros'
    result = [(float(d['bseco'].max()),)]
