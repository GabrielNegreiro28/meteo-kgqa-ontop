- id: E157
  category: simples
  question: Quantos milímetros de chuva SBAT acumulou em abril de 2022, contando só boletins de hora cheia?
  expected_behavior: answerable
  rationale: A grandeza e o recorte pedidos existem nos CSVs originais.
  assumptions: UTC−3 fixo; início inclusivo e fim exclusivo. Vazios, datas inválidas e valores de precip fora de [0, 300]
    mm descartados. Duplicatas do mesmo instante (estação e hora) reduzidas à média dos valores válidos. Somente boletins
    de hora cheia, para não duplicar janelas de chuva.
  oracle_pandas: |
    import pandas as pd
    stations = ['SBAT']
    parts = []
    for chunk in pd.read_csv('precipitacao.csv', usecols=['sigla', 'hora_observacao', 'precip'], chunksize=100000):
        if stations is not None:
            chunk = chunk.loc[chunk['sigla'].isin(stations)]
        chunk = chunk.loc[(chunk['hora_observacao'] >= '2022-04-01') & (chunk['hora_observacao'] < '2022-05-01')].copy()
        parts.append(chunk)
    d = pd.concat(parts, ignore_index=True)
    d['hora_observacao'] = pd.to_datetime(d['hora_observacao'], errors='coerce')
    d['precip'] = pd.to_numeric(d['precip'], errors='coerce')
    d = d.loc[d['hora_observacao'].notna() & d['precip'].between(0, 300)]
    d = d.groupby(['sigla', 'hora_observacao'], as_index=False)['precip'].mean()
    d = d.loc[(d['hora_observacao'].dt.minute == 0) & (d['hora_observacao'].dt.second == 0)]
    assert not d.empty, 'Sem observações válidas após os filtros'
    result = [(float(d['precip'].sum()),)]
