questions:
- id: E01
  category: simples
  question: Qual foi a média do bulbo úmido em SBBQ em agosto de 2016?
  expected_behavior: answerable
  rationale: A estatística solicitada é calculável diretamente nos boletins da variável e do período indicados.
  assumptions: 'Hora local fixa UTC−3, intervalos com início inclusivo e fim exclusivo; vazios e valores fora de [-40, 50]
    em bumido descartados. Duplicatas no mesmo instante são reduzidas à média dos valores válidos. Unidades originais: °C
    para temperaturas, % para umidade, hPa para QNH, nós para vento, mm para chuva e minutos para duração.'
  oracle_pandas: |
    import pandas as pd
    stations = ['SBBQ']
    parts = []
    for chunk in pd.read_csv('temperatura.csv', usecols=['sigla', 'hora_observacao', 'bumido'], chunksize=100000):
        if stations is not None:
            chunk = chunk.loc[chunk['sigla'].isin(stations)]
        chunk = chunk.loc[(chunk['hora_observacao'] >= '2016-08-01') & (chunk['hora_observacao'] < '2016-09-01')].copy()
        parts.append(chunk)
    d = pd.concat(parts, ignore_index=True)
    d['hora_observacao'] = pd.to_datetime(d['hora_observacao'], errors='coerce')
    d['bumido'] = pd.to_numeric(d['bumido'], errors='coerce')
    d = d.loc[d['hora_observacao'].notna() & d['bumido'].between(-40, 50)]
    d = d.groupby(['sigla', 'hora_observacao'], as_index=False)['bumido'].mean()
    result = [(float(d['bumido'].mean()),)]
