  question: Como variou a velocidade média do vento de SBTG ao longo dos meses de 2023?
  expected_behavior: answerable
  rationale: A grandeza e o recorte pedidos estão disponíveis nos CSVs originais.
  assumptions: UTC−3 fixo; início inclusivo e fim exclusivo. Vazios, datas inválidas e valores de velvento fora de [0, 150]
    nós descartados. Um boletim por estação e instante, usando o maior valor entre cabeceiras. Meses com dados válidos em
    ordem cronológica; meses ausentes omitidos.
  oracle_pandas: |
    import pandas as pd
    stations = ['SBTG']
    parts = []
    for chunk in pd.read_csv('vento.csv', usecols=['sigla', 'hora_observacao', 'velvento'], chunksize=100000):
        if stations is not None:
            chunk = chunk.loc[chunk['sigla'].isin(stations)]
        chunk = chunk.loc[(chunk['hora_observacao'] >= '2023-01-01') & (chunk['hora_observacao'] < '2024-01-01')].copy()
        parts.append(chunk)
    d = pd.concat(parts, ignore_index=True)
    d['hora_observacao'] = pd.to_datetime(d['hora_observacao'], errors='coerce')
    d['velvento'] = pd.to_numeric(d['velvento'], errors='coerce')
    d = d.loc[d['hora_observacao'].notna() & d['velvento'].between(0, 150)]
    d = d.groupby(['sigla', 'hora_observacao'], as_index=False)['velvento'].max()

    assert not d.empty, 'Sem observações válidas após os filtros'
    s = d.groupby(d['hora_observacao'].dt.month)['velvento'].mean()
    result = [(int(month), float(value)) for month, value in s.items()]
