    assert not d.empty, 'Sem observações válidas após os filtros'
    s = d.groupby('sigla')['bumido'].max().reset_index(name='value')
    s = s.sort_values(['value', 'sigla'], ascending=[False, True]).head(5)
    result = [(str(row.sigla), float(row.value)) for row in s.itertuples()]
